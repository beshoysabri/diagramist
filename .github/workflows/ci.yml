name: CI

on:
  pull_request:
  push:
    branches: [main, "v*"]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "24" }
          - { os: macos-latest, node: "22" }
          - { os: windows-latest, node: "22" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:deps
      - run: npm test
      # Ubuntu blocks unprivileged network namespaces by default; the offline test needs one.
      - name: Allow the offline test's network namespace
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm run test:checker

  verify-corpus:
    name: Mermaid.js results checked in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:corpus
